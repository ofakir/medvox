version: '3.8' # Version du format Docker Compose utilisée

services:
  # --- 1. Service Web (Application PHP + API Gemini) ---
  web:
    build: . # Demande à Docker de construire l'image à partir du Dockerfile local.
    container_name: medical_app # Nom du conteneur pour l'identifier facilement.
    ports:
      - "8080:80" # Redirige le port 8080 de ton PC vers le port 80 du conteneur.
    volumes:
      - .:/var/www/html # Synchronise ton code local avec le conteneur (les modifs sont instantanées).
    env_file:
      - .env # Contient GROQ_API_KEY (copie .env.example en .env). Jamais commité.
    environment: # Variables de configuration pour la connexion à la base de données.
      - DB_HOST=db # Le serveur de base de données est le service nommé 'db'.
      - DB_NAME=cabinet_medical # Nom de la base de données médicale.
      - DB_USER=root # Utilisateur principal.
      - DB_PASSWORD=root_password # Mot de passe défini ci-dessous.
    depends_on:
      - db # L'application attend que la base de données soit prête avant de démarrer.
    networks:
      - medical_network # Réseau privé pour la communication entre les services.
    restart: unless-stopped # Redémarre automatiquement sauf si tu l'arrêtes manuellement.

  # --- 2. Service Base de Données (MySQL) ---
  db:
    image: mysql:8.0 # Utilise l'image officielle MySQL version 8.0.
    container_name: medical_db
    ports:
      - "3307:3306" # Port 3307 sur ton PC pour éviter les conflits avec un MySQL déjà installé.
    environment:
      MYSQL_ROOT_PASSWORD: root_password # Définit le mot de passe administrateur.
      MYSQL_DATABASE: cabinet_medical # Crée automatiquement la base au premier lancement.
      MYSQL_USER: medical_user # Utilisateur secondaire.
      MYSQL_PASSWORD: medical_pass
    volumes:
      - mysql_data:/var/lib/mysql # Stockage persistant des dossiers patients (ne s'efface pas).
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Exécute ton script SQL pour créer les tables au départ.
    networks:
      - medical_network
    restart: unless-stopped

  # --- 3. Service phpMyAdmin (Gestionnaire de Base de Données) ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin # Outil web pour visualiser tes tables.
    container_name: medical_phpmyadmin
    ports:
      - "8081:80" # Accède à tes tables via http://localhost:8081.
    environment:
      PMA_HOST: db # Se connecte au service 'db' défini plus haut.
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - medical_network
    restart: unless-stopped

# --- Configuration des Volumes et du Réseau ---
volumes:
  mysql_data: # Espace de stockage dédié pour tes données MySQL.
    driver: local

networks:
  medical_network: # Pont réseau isolé pour ton projet MedVox.
    driver: bridge